spring.application.name=backend-api

# Oracle/systemd sets PORT for the backend service
server.port=${PORT:8080}

# Disable default generated user/password (we use Supabase bearer tokens only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Supabase project settings (safe to use anon key here; never use service_role on the client)
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Server hardening / proxy awareness
server.forward-headers-strategy=framework

# Request limits (keep small; game payloads are tiny JSON)
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=2MB
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:16}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:64}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:16}

# Comma-separated list of allowed origins for browser clients (Vercel, localhost, etc.)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Basic API rate limit (per user/IP per minute). Tune based on VM capacity.
app.ratelimit.per-minute=${RATE_LIMIT_PER_MINUTE:120}
app.ratelimit.max-keys=${RATE_LIMIT_MAX_KEYS:2048}

# Short bounded caches reduce repeated Supabase auth/admin checks on the 1 GB Oracle VM.
# Keep TTLs small so role/session changes still take effect quickly.
app.auth-cache.ttl-seconds=${AUTH_CACHE_TTL_SECONDS:30}
app.auth-cache.max-entries=${AUTH_CACHE_MAX_ENTRIES:512}
app.supabase-cache.admin-ttl-seconds=${SUPABASE_ADMIN_CACHE_TTL_SECONDS:30}
app.supabase-cache.max-entries=${SUPABASE_CACHE_MAX_ENTRIES:512}

# Never show the default "whitelabel" HTML page.
server.error.whitelabel.enabled=false

# API request body cap (bytes) for /api/* endpoints.
app.request.max-bytes=${REQUEST_MAX_BYTES:32768}

# Android APK update metadata. When latest-build is greater than the Android
# app's build number and apk-url is set, the mobile app shows an update prompt.
app.android-update.latest-version=${ANDROID_LATEST_VERSION:}
app.android-update.latest-build=${ANDROID_LATEST_BUILD:0}
app.android-update.apk-url=${ANDROID_APK_URL:}
app.android-update.source-apk-url=${ANDROID_SOURCE_APK_URL:}
app.android-update.apk-sha256=${ANDROID_APK_SHA256:}
app.android-update.apk-size-bytes=${ANDROID_APK_SIZE_BYTES:0}
app.android-update.force=${ANDROID_FORCE_UPDATE:false}
app.android-update.release-notes=${ANDROID_RELEASE_NOTES:}
