name: Flutter Android APK

on:
  push:
    branches: [main]
    paths:
      - "project/game-desktop/**"
      - ".github/workflows/flutter-android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/game-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure Android platform files exist
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Ensure Android network access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = p.read_text(encoding="utf-8")
          changed = False

          missing_permissions = []
          if "android.permission.INTERNET" not in text:
              missing_permissions.append('    <uses-permission android:name="android.permission.INTERNET"/>\n')
          if "android.permission.ACCESS_NETWORK_STATE" not in text:
              missing_permissions.append('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n')

          if missing_permissions:
              lines = text.splitlines(True)
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if (not inserted) and ("<manifest" in line):
                      out.extend(missing_permissions)
                      inserted = True
              if not inserted:
                  raise SystemExit("Failed to insert permissions: <manifest> not found")
              text = "".join(out)
              changed = True

          # The production backend currently uses an Oracle public IP over HTTP.
          # Android release builds block cleartext by default unless explicitly allowed.
          if "android:usesCleartextTraffic" not in text:
              text, count = re.subn(
                  r"(<application\b)",
                  r'\1 android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Failed to add usesCleartextTraffic: <application> not found")
              changed = True

          if changed:
              p.write_text(text, encoding="utf-8")
              print("Updated Android network permissions/cleartext access")
          else:
              print("Android network access already configured")
          PY

      - name: Set Android package name (com.kingmaker.admin)
        shell: bash
        run: |
          APP_ID="com.kingmaker.admin"
          OLD_ID="com.example.kingmaker"
          # Update build files / manifests
          for f in android/app/build.gradle android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then
              sed -i "s/${OLD_ID//./\\.}/${APP_ID//./\\.}/g" "$f" || true
            fi
          done
          # Update MainActivity package + path (Kotlin)
          OLD_PATH="android/app/src/main/kotlin/com/example/kingmaker/MainActivity.kt"
          if [ -f "$OLD_PATH" ]; then
            NEW_DIR="android/app/src/main/kotlin/com/kingmaker/admin"
            mkdir -p "$NEW_DIR"
            sed -i "s/^package .*/package $APP_ID/" "$OLD_PATH" || true
            mv "$OLD_PATH" "$NEW_DIR/MainActivity.kt"
          fi
          # Replace any remaining occurrences in android folder
          if command -v grep >/dev/null 2>&1; then
            grep -RIl "$OLD_ID" android | while read -r file; do
              sed -i "s/${OLD_ID//./\\.}/${APP_ID//./\\.}/g" "$file" || true
            done || true
          fi

      - name: Write google-services.json (optional)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON secret not set (ok unless you use Firebase SDK in-app)."
          fi

      - name: Patch Android in-app APK installer
        run: python3 tools/patch_android_installer.py

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets." >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kingmaker-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=kingmaker-release.jks
          EOF
          sed -i 's/^[[:space:]]*//' android/key.properties
          python3 tools/patch_android_signing.py

      - name: Set Android app name (King Maker)
        shell: bash
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">King Maker</string>#' "$STRINGS" || true
          fi
          if [ -f "$MANIFEST" ]; then
            # Prefer using @string/app_name in the manifest.
            sed -i 's/android:label="[^"]*"/android:label="@string\\/app_name"/' "$MANIFEST" || true
          fi

      - name: Build APK (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          API_BASE_URL="http://80.225.236.170"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing required secrets SUPABASE_URL / SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          APP_PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          APP_VERSION_NAME="${APP_PUBSPEC_VERSION%%+*}"
          APP_BUILD_NUMBER="${APP_PUBSPEC_VERSION##*+}"
          if [ "$APP_VERSION_NAME" = "$APP_BUILD_NUMBER" ]; then
            APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          flutter build apk --release \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$APP_VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-android-apk
          path: project/game-desktop/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Android latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          ASSET="KingMaker.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK" "$ASSET"
          sha256sum "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          stat -c%s "$ASSET" > "$ASSET.size"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Android Latest" --notes "Latest Android APK for in-app updater." --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.size" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Sync Android update metadata to Oracle
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_SSH_PRIVATE_KEY:-}" ]; then
            echo "ORACLE_SSH_PRIVATE_KEY is not set; skipping Oracle Android metadata sync."
            exit 0
          fi

          HOST="${ORACLE_HOST:-80.225.236.170}"
          USER="${ORACLE_USER:-opc}"
          ASSET="KingMaker.apk"
          APP_PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          APP_VERSION_NAME="${APP_PUBSPEC_VERSION%%+*}"
          APP_BUILD_NUMBER="${APP_PUBSPEC_VERSION##*+}"
          if [ "$APP_VERSION_NAME" = "$APP_BUILD_NUMBER" ]; then
            APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          APK_SHA256="$(tr -d '[:space:]' < "$ASSET.sha256")"
          APK_SIZE_BYTES="$(tr -d '[:space:]' < "$ASSET.size")"
          SOURCE_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/${ASSET}"

          KEY_FILE="$(mktemp)"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          cleanup() { rm -f "$KEY_FILE"; }
          trap cleanup EXIT

          ssh -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$USER@$HOST" \
            "ANDROID_LATEST_VERSION='$APP_VERSION_NAME' ANDROID_LATEST_BUILD='$APP_BUILD_NUMBER' ANDROID_SOURCE_APK_URL='$SOURCE_APK_URL' ANDROID_APK_SHA256='$APK_SHA256' ANDROID_APK_SIZE_BYTES='$APK_SIZE_BYTES' bash -s" <<'REMOTE'
          set -euo pipefail
          TMP="/tmp/kingmaker-backend.env.$$"
          BACKUP="/etc/kingmaker-backend.env.bak.$(date +%Y%m%d%H%M%S)"
          sudo cp /etc/kingmaker-backend.env "$BACKUP"
          sudo awk '!/^(ANDROID_LATEST_VERSION|ANDROID_LATEST_BUILD|ANDROID_SOURCE_APK_URL|ANDROID_APK_URL|ANDROID_APK_SHA256|ANDROID_APK_SIZE_BYTES|APP_ANDROID_UPDATE_LATEST_VERSION|APP_ANDROID_UPDATE_LATEST_BUILD|APP_ANDROID_UPDATE_SOURCE_APK_URL|APP_ANDROID_UPDATE_APK_URL|APP_ANDROID_UPDATE_APK_SHA256|APP_ANDROID_UPDATE_APK_SIZE_BYTES)=/' /etc/kingmaker-backend.env > "$TMP"
          {
            printf 'ANDROID_LATEST_VERSION=%s\n' "$ANDROID_LATEST_VERSION"
            printf 'ANDROID_LATEST_BUILD=%s\n' "$ANDROID_LATEST_BUILD"
            printf 'ANDROID_SOURCE_APK_URL=%s\n' "$ANDROID_SOURCE_APK_URL"
            printf 'ANDROID_APK_SHA256=%s\n' "$ANDROID_APK_SHA256"
            printf 'ANDROID_APK_SIZE_BYTES=%s\n' "$ANDROID_APK_SIZE_BYTES"
            printf 'APP_ANDROID_UPDATE_LATEST_VERSION=%s\n' "$ANDROID_LATEST_VERSION"
            printf 'APP_ANDROID_UPDATE_LATEST_BUILD=%s\n' "$ANDROID_LATEST_BUILD"
            printf 'APP_ANDROID_UPDATE_SOURCE_APK_URL=%s\n' "$ANDROID_SOURCE_APK_URL"
            printf 'APP_ANDROID_UPDATE_APK_SHA256=%s\n' "$ANDROID_APK_SHA256"
            printf 'APP_ANDROID_UPDATE_APK_SIZE_BYTES=%s\n' "$ANDROID_APK_SIZE_BYTES"
          } >> "$TMP"
          sudo install -m 600 -o root -g root "$TMP" /etc/kingmaker-backend.env
          rm -f "$TMP"
          sudo systemctl restart kingmaker-backend
          sleep 10
          curl -fsS --max-time 10 http://127.0.0.1/readyz >/dev/null || curl -fsS --max-time 10 http://127.0.0.1:8080/readyz >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1/public/android/latest >/dev/null || curl -fsS --max-time 10 http://127.0.0.1:8080/public/android/latest >/dev/null
          REMOTE
