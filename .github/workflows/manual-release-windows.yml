name: Manual Release - Windows Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag (optional, e.g. v1.2.5). Leave blank to auto-bump latest Windows release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/game-desktop
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAGS="$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')"
            BEST_MAJOR=1
            BEST_MINOR=2
            BEST_PATCH=4
            while IFS= read -r TAG; do
              if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                if (( MAJOR > BEST_MAJOR || \
                      (MAJOR == BEST_MAJOR && MINOR > BEST_MINOR) || \
                      (MAJOR == BEST_MAJOR && MINOR == BEST_MINOR && PATCH > BEST_PATCH) )); then
                  BEST_MAJOR="$MAJOR"
                  BEST_MINOR="$MINOR"
                  BEST_PATCH="$PATCH"
                fi
              fi
            done <<< "$TAGS"
            VERSION="v${BEST_MAJOR}.${BEST_MINOR}.$((BEST_PATCH + 1))"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Windows release version: $VERSION"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ensure Windows runner exists
        run: |
          if [ ! -d "windows" ]; then
            flutter create . --platforms=windows
          fi

      - name: Patch Windows runner defaults
        shell: pwsh
        run: |
          ./tools/patch_windows_runner.ps1 -ProjectDir "${{ github.workspace }}\\project\\game-desktop"

      - name: Build Windows (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          API_BASE_URL="http://80.225.236.170"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing required secrets SUPABASE_URL / SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          flutter build windows --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$VERSION"

      - name: Ensure exe is named KingMaker.exe
        run: |
          set -euo pipefail
          OUT_DIR="build/windows/x64/runner/Release"
          if [ ! -f "$OUT_DIR/KingMaker.exe" ]; then
            if [ -f "$OUT_DIR/funtarget_game.exe" ]; then mv "$OUT_DIR/funtarget_game.exe" "$OUT_DIR/KingMaker.exe"; fi
            if [ -f "$OUT_DIR/kingmaker.exe" ]; then mv "$OUT_DIR/kingmaker.exe" "$OUT_DIR/KingMaker.exe"; fi
          fi

      - name: Verify release output contains exe + assets
        run: |
          set -euo pipefail
          OUT_DIR="build/windows/x64/runner/Release"
          test -d "$OUT_DIR"
          if [ ! -f "$OUT_DIR/KingMaker.exe" ]; then
            echo "KingMaker.exe not found. Contents of $OUT_DIR:" >&2
            ls -la "$OUT_DIR" || true
            echo "Exe candidates:" >&2
            ls -la "$OUT_DIR"/*.exe 2>/dev/null || true
            exit 1
          fi
          test -d "$OUT_DIR/data/flutter_assets"
          test -f "$OUT_DIR/data/flutter_assets/assets/funTargrtAsset/media/FunTargetImages/Bg.jpg"
          test -f "$OUT_DIR/data/flutter_assets/assets/funTargrtAsset/media/FunTargetImages/Wheel5.png"
          test -f "$OUT_DIR/data/flutter_assets/assets/funTargrtAsset/Sounds/clock_ticking.wav"

      - name: Package zip
        run: |
          set -euo pipefail
          OUT_DIR="build/windows/x64/runner/Release"
          test -d "$OUT_DIR"
          cd "$OUT_DIR"
          7z a -tzip "../../../../King Maker.zip" ./*

      - name: Create/Update GitHub Release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $assetNew = "${{ github.workspace }}\\project\\game-desktop\\build\\King Maker.zip"
          if (!(Test-Path $assetNew)) { throw "Asset not found: $assetNew" }

          gh release view $version --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $version $assetNew --title $version --notes "See CHANGELOG.md" --repo "${{ github.repository }}"
          } else {
            gh release upload $version $assetNew --clobber --repo "${{ github.repository }}"
          }
