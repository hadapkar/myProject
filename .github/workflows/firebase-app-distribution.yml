name: Firebase App Distribution (Android)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Flutter Android APK workflow run id to distribute"
        required: true
  workflow_run:
    workflows: ["Flutter Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: firebase-android-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from Android workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.id
              : Number(context.payload.inputs?.run_id || 0);
            if (!runId) {
              throw new Error('RUN_ID is required when manually dispatching this workflow. Prefer rerunning Flutter Android APK.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifact = artifacts.find((item) => item.name === 'kingmaker-android-apk');
            if (!artifact) {
              throw new Error(`kingmaker-android-apk artifact not found on run ${runId}`);
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('kingmaker-android-apk.zip', Buffer.from(download.data));

      - name: Extract APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          unzip -o kingmaker-android-apk.zip -d dist
          APK_PATH="$(find dist -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in artifact" >&2
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Write service account key
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret" >&2
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json

      - name: Distribute to Firebase App Distribution
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "Missing FIREBASE_APP_ID secret" >&2
            exit 1
          fi
          if [ -n "$FIREBASE_TESTERS" ]; then
            echo "Distributing to testers: $FIREBASE_TESTERS"
            firebase appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --testers "$FIREBASE_TESTERS" \
              --release-notes "Commit ${GITHUB_SHA}"
            exit 0
          fi
          if [ -n "$FIREBASE_GROUPS" ]; then
            echo "Distributing to groups: $FIREBASE_GROUPS"
            firebase appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_GROUPS" \
              --release-notes "Commit ${GITHUB_SHA}"
            exit 0
          fi
          echo "Missing distribution target. Set either FIREBASE_TESTERS (comma-separated emails) or FIREBASE_GROUPS (example: testers)." >&2
          exit 1
